#
# Structure of the cheatsheet PDF generated by the ``conda_cheatsheet`` Sphinx
# extension. The table rows live in the sibling CSV files, which are also
# rendered on the cheatsheet page (``cheatsheet.rst``).
title: Cheatsheet
footer:
  - label: Website
    text: conda.org
  - label: GitHub
    text: https://github.com/conda
  - label: Documentation
    text: docs.conda.io
  - label: Chat
    text: https://conda.zulipchat.com
# Tokens rendered in green in the PDF commands (in addition to version numbers).
placeholders:
  - ARG
  - CHANNELNAME
  - COMMAND
  - ENV
  - ENVNAME
  - NEWENV
  - NEWENVNAME
  - NUMBER
  - PKGNAME
  - PKGNAME1
  - PKGNAME2
sections:
  - title: Quickstart
    tip: It is recommended to create a new environment for any new project or workflow.
    csv: quickstart.csv
  - title: Channels and Packages
    tip: Package dependencies and platform specifics are automatically resolved when using conda.
    csv: channels-and-packages.csv
  - title: Working with Conda Environments
    tip: List environments at the beginning of your session. Environments with an asterisk are active.
    csv: working-with-environments.csv
  - title: Environment Management
    tip: Specifying the environment name confines conda commands to that environment.
    csv: environment-management.csv
    page_break_before: true
  - title: Exporting Environments
    tip: Name your export file after your environment to preserve your environment name.
    csv: exporting-environments.csv
  - title: Importing Environments
    tip: When importing an environment, conda resolves platform and package specifics.
    csv: importing-environments.csv
  - title: Additional Hints
    csv: additional-hints.csv
