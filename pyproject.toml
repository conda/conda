[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling >=1.12.2",
  "hatch-vcs >=0.2.0",
]

[project]
authors = [{ name = "Anaconda, Inc.", email = "conda@continuum.io" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "archspec >=0.2.3",
  "backports.zstd >=1.3.0; python_version < '3.14'",
  "boltons >=23.0.0",
  # eMudhra Intermediate CA Compromise
  "certifi >=2026.10.19",
  "charset-normalizer",
  # Disabled due to conda-launchers not being available on PyPI
  # "conda-launchers >=24.7.1; sys_platform == 'win32'",
  # Disabled due to conda-libmamba-solver not being available on PyPI
  # "conda-libmamba-solver >=26.4.1",
  "conda-package-handling >=2.2.0",
  "conda-rattler-solver >=26.10.2",
  "distro >=1.5.0",
  "frozendict >=2.4.2",
  "menuinst >=2",
  "msgpack >=1.1.1",
  "packaging >=26.3",
  "platformdirs >=3.10.0",
  "pluggy >=1.6.0",
  "pycosat >=0.6.3",
  "requests >=2.28.0,<3",
  "ruamel.yaml >=0.11.14,<0.20",
  "setuptools >=60.0.0",
  "tqdm >=4",
  "truststore >=0.8.0",
]
description = "OS-agnostic, system-level binary package manager."
dynamic = ["version"]
license = "BSD-3-Clause"
license-files = ["LICENSE", "AUTHORS.md"]
name = "conda"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
conda = "conda.cli.main_pip:main"

[project.urls]
changelog = "https://github.com/conda/conda/blob/main/CHANGELOG.md"
documentation = "https://docs.conda.io/projects/conda/en/stable/"
repository = "https://github.com/conda/conda"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "pragma: py$PYTHON_MAJOR_VERSION no cover",
  "pragma: $TEST_PLATFORM no cover",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "def __repr__",
  '\s*\.\.\.$',
  "if TYPE_CHECKING:",  # ignoring type checking imports
]
omit = [
  "*/site-packages/*",
  '*\site-packages\*',
  "conda/_private/shards/typing.py",
  "conda/_vendor.py",
  "conda/cli/activate.py",
  "conda/cli/main_package.py",
  "conda/console.py",
  "conda/exports.py",
  "conda/gateways/connection/adapters/ftp.py",
  "conda/gateways/connection/adapters/s3.py",
  "tests/*",
  "utils/*",
]
partial_branches = [
  "pragma: no branch",
]
show_missing = true
skip_covered = true
sort = "Miss"

[tool.coverage.run]
# store relative paths in coverage information
relative_files = true

[tool.hatch.build]
exclude = [
  "tests/**",
]
include = ["conda"]

[tool.hatch.build.hooks.vcs]
version-file = "conda/_version.py"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "dirty-tag"
version_scheme = "semver-pep440-release-branch"

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
# disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
# TODO(PY312): explicit-override
enable_error_code = [
  "deprecated",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = "conda/"
follow_imports_for_stubs = true
follow_untyped_imports = true
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
pretty = true
python_version = "3.11"
show_column_numbers = true
show_error_code_links = true
show_error_codes = true
strict_bytes = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pixi.dependencies]
# keep in sync with tests/requirements.txt and tests/requirements-ci.txt
# (see tests/test_dev_environment.py)
archspec = ">=0.2.3"
boltons = ">=23.0.0"
charset-normalizer = "*"
conda = "*"
conda-libmamba-solver = ">=26.4.1"
conda-package-handling = ">=2.2.0"
conda-pycosat-solver = ">=26.10.0"
conda-pypi = ">=0.10.1"
conda-rattler-solver = ">=26.10.2"
coverage = "*"
distro = ">=1.5.0"
flask = ">=2.2"
frozendict = ">=2.4.2"
git = "*"
importlib_resources = ">=5.10"
menuinst = ">=2"
msgpack-python = ">=1.1.1"
packaging = ">=26.3"
pexpect = "*"
pip = "*"
platformdirs = ">=3.10.0"
pluggy = ">=1.6.0"
pycosat = ">=0.6.3"
pytest = "*"
pytest-benchmark = "*"
pytest-cov = "*"
pytest-mock = "*"
pytest-rerunfailures = "*"
pytest-split = "*"
pytest-timeout = "*"
pytest-xprocess = "*"
requests = ">=2.28.0,<3"
responses = "*"
"ruamel.yaml" = ">=0.11.14,<0.20"
setuptools = ">=60.0.0"
setuptools_scm = "*"
tomli = "*"
tqdm = ">=4"
truststore = ">=0.8.0"
werkzeug = ">=2.2"

[tool.pixi.environments]
default = { features = ["py311", "main"] }
py311-conda-forge = { features = ["py311", "conda-forge"] }
py311-main = { features = ["py311", "main"] }
py312-conda-forge = { features = ["py312", "conda-forge"] }
py312-main = { features = ["py312", "main"] }
py313-conda-forge = { features = ["py313", "conda-forge"] }
py313-main = { features = ["py313", "main"] }
py314-conda-forge = { features = ["py314", "conda-forge"] }
py314-conda-forge-full = { features = ["py314", "conda-forge", "s3", "typing"] }
py314-main = { features = ["py314", "main"] }

[tool.pixi.feature.conda-forge]
channels = ["conda-forge"]

[tool.pixi.feature.conda-forge.dependencies]
xonsh = "*"

[tool.pixi.feature.conda-forge.target.unix.activation.env]
# configure the channel like the CI condarc
CONDARC = "$PIXI_PROJECT_ROOT/dev/pixi/condarc-conda-forge.yml"

[tool.pixi.feature.conda-forge.target.win.activation.env]
CONDARC = "%PIXI_PROJECT_ROOT%\\dev\\pixi\\condarc-conda-forge.yml"

[tool.pixi.feature.main]
# osx-64 is not offered by the Anaconda main channel for current conda releases
channels = [
  "https://repo.anaconda.com/pkgs/main",
  "https://repo.anaconda.com/pkgs/r",
  # lowest priority fallback, only used for packages missing from main
  { channel = "conda-forge", priority = -1 },
]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64"]

[tool.pixi.feature.main.dependencies]
xonsh = { version = "*", channel = "conda-forge" }

[tool.pixi.feature.main.target.unix.activation.env]
# configure the channel like the CI condarc
CONDARC = "$PIXI_PROJECT_ROOT/dev/pixi/condarc-main.yml"

[tool.pixi.feature.main.target.win.activation.env]
CONDARC = "%PIXI_PROJECT_ROOT%\\dev\\pixi\\condarc-main.yml"

[tool.pixi.feature.py311.dependencies]
"backports.zstd" = ">=1.3.0"
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
"backports.zstd" = ">=1.3.0"
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
"backports.zstd" = ">=1.3.0"
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.s3.dependencies]
boto3 = "!=1.33.0"
minio-server = { version = "*", channel = "conda-forge" }

[tool.pixi.feature.typing.dependencies]
lxml = "*"
mypy = "*"

[tool.pixi.target.linux-64.dependencies]
patchelf = "*"

[tool.pixi.target.linux-aarch64.dependencies]
patchelf = "*"

[tool.pixi.target.unix.activation.env]
# run conda from source; keep any existing PYTHONPATH, like the legacy dev/start did
PYTHONPATH = "$PIXI_PROJECT_ROOT${PYTHONPATH:+:$PYTHONPATH}"

[tool.pixi.target.win.activation.env]
PYTHONPATH = "%PIXI_PROJECT_ROOT%;%PYTHONPATH%"

[tool.pixi.target.win-64.dependencies]
conda-launchers = ">=24.7.1"
pywin32 = "*"

[tool.pixi.tasks]
conda-init = "conda init --install"
integration = "pytest -m integration"
lint = "pre-commit run --all-files"
smoketest = "pytest tests/test_create.py -k test_create_install_update_remove"
unit = "pytest -m 'not integration'"

[tool.pixi.workspace]
channels = []
name = "conda"
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
requires-pixi = ">=0.84"

[tool.pixi.workspace.conda-pypi-map]
# main has no PyPI name mapping; without this pixi would also resolve the
# [project] dependencies from PyPI instead of using the conda packages
# (msgpack-python is named msgpack on PyPI)
"https://repo.anaconda.com/pkgs/main" = { mapping = { msgpack-python = "msgpack" }, mapping-mode = "replace", same-name-heuristic = true }

[tool.pytest.ini_options]
addopts = [
  "--color=auto",
  # "--cov=conda",   # passed in test runner scripts instead (avoid debugger)
  "--cov-append",
  "--cov-branch",
  "--cov-report=term",  # print summary table to screen
  "--cov-report=xml",  # for codecov/codecov-action upload
  "--durations=16",
  "--junitxml=test-report.xml",
  "--splitting-algorithm=least_duration",
  "--store-durations",  # pytest-split, update duration cache
  "--clean-durations",  # pytest-split, remove duration for tests no longer present
  "--strict-markers",
  "--tb=native",
  "-vv",
]
doctest_optionflags = [
  "NORMALIZE_WHITESPACE",
  "IGNORE_EXCEPTION_DETAIL",
  "ALLOW_UNICODE",
  "ELLIPSIS",
]
filterwarnings = [
  # elevate all deprecation warnings to errors
  "error::PendingDeprecationWarning",
  "error::DeprecationWarning",
  "error::FutureWarning",
  "ignore:Implicit installation of pip as a Python dependency:PendingDeprecationWarning",
  "ignore:Implicit installation of pip as a Python dependency:FutureWarning",
]
markers = [
  "integration: integration tests that usually require an internet connect",
  "slow: slow running tests",
  "benchmark: benchmark tests",
  "memray: memory use tests",
]
minversion = "3.0"
norecursedirs = [
  "tests/data/*",
  "tests/integration/*",
  "tests/plugins/data/*",
  "docs",
  ".git",
]
pythonpath = [
  # faking a test-plugin to test ImportError handling
  "tests/plugins/data/test-plugin",
]
testpaths = ["tests"]

[tool.ruff]
exclude = [
  "conda/auxlib",
  "tests/data/conda_format_repo",
  "tests/data/env_metadata",
]
show-fixes = true

[tool.ruff.lint]
flake8-type-checking = { exempt-modules = [], strict = true }
ignore = [
  "D101",  # Missing docstring in public class
  "D102",  # Missing docstring in public method
  "D103",  # Missing docstring in public function
  "D104",  # Missing docstring in public package
  "D105",  # Missing docstring in magic method
  "D107",  # Missing docstring in `__init__`
  "E402",  # module level import not at top of file
  "E501",  # line too long
  "E722",  # do not use bare 'except'
  "E731",  # do not assign a lambda expression, use a def
  "UP031",  # do not fix printf-style string formatting
]
pydocstyle = { convention = "google" }
# see https://docs.astral.sh/ruff/rules/
select = [
  # Enable ANN locally for type hints linting
  # "ANN", # flake8-annotations
  "B012",  # bugbear
  "D1",  # pydocstyle
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "FA",  # flake8-future-annotations
  "G",  # flake8-logging-format
  "I",  # isort
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "RUF100",  # Unused noqa directive
  "S101",  # forbid assert
  "T10",  # flake8-debugger
  "TC",  # flake8-type-checking
  "TID251",  # flake8-tidy-imports: banned-api
  "TID253",  # flake8-tidy-imports: banned-module-level-imports
  "UP",  # pyupgrade
  "W",  # pycodestyle warnings
]

[tool.ruff.lint.extend-per-file-ignores]
"conda/testing/*" = [
  "ANN",  # flake8-annotations
  "S101",  # forbid assert
]
"docs/*" = [
  "ANN",  # flake8-annotations
  "D1",  # pydocstyle
]
"tests/*" = [
  "ANN",  # flake8-annotations
  "D1",  # pydocstyle
  "S101",  # forbid assert
  "TID251",  # flake8-tidy-imports
  "TID253",  # flake8-tidy-imports: tests may import requests directly
]

[tool.ruff.lint.flake8-tidy-imports]
# Prevent accidental module-level imports of heavy packages on the startup path.
# Files that legitimately import these packages (e.g. conda/gateways/) should
# suppress the warning with # noqa: TID253 on the relevant import lines.
banned-module-level-imports = ["requests"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"json".msg = "Use `conda.common.serialize.json` instead."
