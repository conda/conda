[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling >=1.12.2",
  "hatch-vcs >=0.2.0",
]

[project]
authors = [{ name = "Anaconda, Inc.", email = "conda@continuum.io" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "archspec >=0.2.3",
  "backports.zstd >=1.3.0; python_version < '3.14'",
  "boltons >=23.0.0",
  # eMudhra Intermediate CA Compromise
  "certifi >=2026.10.19",
  "charset-normalizer",
  # Disabled due to conda-launchers not being available on PyPI
  # "conda-launchers >=24.7.1; sys_platform == 'win32'",
  # Disabled due to conda-libmamba-solver not being available on PyPI
  # "conda-libmamba-solver >=26.4.1",
  "conda-package-handling >=2.2.0",
  "conda-rattler-solver >=26.10.2",
  "distro >=1.5.0",
  "frozendict >=2.4.2",
  "menuinst >=2",
  "msgpack >=1.1.1",
  "packaging >=26.3",
  "platformdirs >=3.10.0",
  "pluggy >=1.6.0",
  "pycosat >=0.6.3",
  "requests >=2.28.0,<3",
  "ruamel.yaml >=0.11.14,<0.20",
  "setuptools >=60.0.0",
  "tqdm >=4",
  "truststore >=0.8.0",
]
description = "OS-agnostic, system-level binary package manager."
dynamic = ["version"]
license = "BSD-3-Clause"
license-files = ["LICENSE", "AUTHORS.md"]
name = "conda"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
conda = "conda.cli.main_pip:main"

[project.urls]
changelog = "https://github.com/conda/conda/blob/main/CHANGELOG.md"
documentation = "https://docs.conda.io/projects/conda/en/stable/"
repository = "https://github.com/conda/conda"

[tool.conda.dependencies]
archspec = ">=0.2.3"
"backports.zstd" = ">=1.3.0"
boltons = ">=23.0.0"
charset-normalizer = "*"
conda-libmamba-solver = ">=26.4.1"
conda-package-handling = ">=2.2.0"
conda-pycosat-solver = ">=26.10.0"
conda-pypi = ">=0.10.1"
conda-rattler-solver = ">=26.10.2"
distro = ">=1.5.0"
frozendict = ">=2.4.2"
menuinst = ">=2"
msgpack-python = ">=1.1.1"
packaging = ">=26.3"
platformdirs = ">=3.10.0"
pluggy = ">=1.6.0"
pycosat = ">=0.6.3"
python = ">=3.11"
requests = ">=2.28.0,<3"
"ruamel.yaml" = ">=0.11.14,<0.20"
setuptools = ">=60.0.0"
setuptools_scm = "*"
tqdm = ">=4"

[tool.conda.environments]
default = { features = ["test", "py314"] }
docs = { features = ["docs"], no-default-feature = true }
lint = { features = ["lint"], no-default-feature = true }
py311 = { features = ["test", "s3", "py311"] }
py312 = { features = ["test", "s3", "py312"] }
py313 = { features = ["test", "s3", "py313"] }
py314 = { features = ["test", "s3", "py314"] }
s3 = { features = ["test", "s3", "py314"] }
typing = { features = ["test", "typing", "py314"] }

[tool.conda.feature.docs]
# plantuml is not available on every platform
platforms = ["linux-64", "osx-64-osx-11-0", "osx-arm64-osx-11-0", "win-64"]

[tool.conda.feature.docs.dependencies]
Pillow = "==13.0.0"
Sphinx = "<10"
boltons = ">=26.2.0"
conda-libmamba-solver = ">=26.10.0"
conda-rattler-solver = ">=26.10.2"
conda-sphinx-theme = "==0.5.0"
frozendict = ">=2.5.0"
linkify-it-py = "==2.2.0"
myst-parser = "==5.1.0"
pip = ">25"
plantuml = "==1.2026.9"
pluggy = "==1.7.0"
pylint = "==4.1.3"
requests = ">=2.28.0,<3"
"ruamel.yaml" = ">=0.11.14,<0.20"
sphinx-argparse = "==0.6.1"
sphinx-autoapi = "==3.9.0"
sphinx-autobuild = "==2025.8.25"
sphinx-copybutton = "==0.5.2"
sphinx-design = "==0.7.0"
sphinx-reredirects = "==1.1.0"
sphinx-sitemap = "==2.9.0"
sphinxcontrib-applehelp = "==2.0.0"
sphinxcontrib-devhelp = "==2.0.0"
sphinxcontrib-htmlhelp = "==2.1.0"
sphinxcontrib-jsmath = "==2.0.0"
sphinxcontrib-mermaid = "==2.1.1"
# docs/environment.yml pins 0.31 from PyPI; conda-forge only has up to 0.30
sphinxcontrib-plantuml = ">=0.30"
sphinxcontrib-programoutput = "==0.20"
sphinxcontrib-qthelp = "==2.0.0"
sphinxcontrib-serializinghtml = "==2.0.0"
tqdm = ">=4.70.1"

[tool.conda.feature.lint]
# identify (required by pre-commit) depends on ukkonen, which is not available
# for win-arm64
platforms = [
  "linux-64",
  "linux-aarch64",
  "osx-64-osx-11-0",
  "osx-arm64-osx-11-0",
  "win-64",
]

[tool.conda.feature.lint.dependencies]
doc8 = "*"
# pre-commit only requires identify >=1.0.0 and the solver may otherwise pick an
# ancient release that does not know the file types used by ruff's hooks
identify = ">=2.6"
pre-commit = "*"
python = "3.14.*"
rstcheck = "*"

[tool.conda.feature.py311]
# conda-forge has no Python < 3.14 builds for win-arm64
platforms = [
  "linux-64",
  "linux-aarch64",
  "osx-64-osx-11-0",
  "osx-arm64-osx-11-0",
  "win-64",
]

[tool.conda.feature.py311.dependencies]
python = "3.11.*"

[tool.conda.feature.py312]
# conda-forge has no Python < 3.14 builds for win-arm64
platforms = [
  "linux-64",
  "linux-aarch64",
  "osx-64-osx-11-0",
  "osx-arm64-osx-11-0",
  "win-64",
]

[tool.conda.feature.py312.dependencies]
python = "3.12.*"

[tool.conda.feature.py313]
# conda-forge has no Python < 3.14 builds for win-arm64
platforms = [
  "linux-64",
  "linux-aarch64",
  "osx-64-osx-11-0",
  "osx-arm64-osx-11-0",
  "win-64",
]

[tool.conda.feature.py313.dependencies]
python = "3.13.*"

[tool.conda.feature.py314.dependencies]
python = "3.14.*"

[tool.conda.feature.s3.dependencies]
boto3 = "!=1.33.0"
minio-server = "*"

[tool.conda.feature.test.dependencies]
conda = "*"
coverage = "*"
flask = ">=2.2"
git = "*"
importlib_resources = ">=5.10"
pexpect = "*"
pip = "*"
pytest = "*"
pytest-benchmark = "*"
pytest-cov = "*"
pytest-mock = "*"
pytest-rerunfailures = "*"
pytest-split = "*"
pytest-timeout = "*"
pytest-xprocess = "*"
responses = "*"
tomli = "*"
truststore = ">=0.8.0"
werkzeug = ">=2.2"

[tool.conda.feature.test.target.linux-64.dependencies]
patchelf = "*"
xonsh = { version = "*", channel = "conda-forge" }

[tool.conda.feature.test.target.linux-aarch64.dependencies]
patchelf = "*"
xonsh = { version = "*", channel = "conda-forge" }

[tool.conda.feature.test.target.win-64.dependencies]
conda-launchers = ">=24.7.1"
pywin32 = "*"

[tool.conda.feature.test.target.win-arm64.dependencies]
conda-launchers = ">=24.7.1"
pywin32 = "*"

[tool.conda.feature.typing]
# lxml is not available for win-arm64
platforms = [
  "linux-64",
  "linux-aarch64",
  "osx-64-osx-11-0",
  "osx-arm64-osx-11-0",
  "win-64",
]

[tool.conda.feature.typing.dependencies]
lxml = "*"
mypy = "*"

[tool.conda.pypi-dependencies]
conda = { path = ".", editable = true }

[tool.conda.tasks]
integration = { cmd = "pytest -m integration", description = "Run integration tests" }
smoketest = { cmd = "pytest tests/test_create.py -k test_create_install_update_remove", description = "Run a quick create/install/update/remove test" }
typing = { cmd = "mypy", default-environment = "typing", description = "Run mypy" }
unit = { cmd = "pytest -m \"not integration\"", description = "Run unit tests" }

[tool.conda.tasks.docs]
cmd = "sphinx-build -b html docs/source docs/_build/html"
default-environment = "docs"
description = "Build the HTML documentation"

[tool.conda.tasks.lint]
cmd = "pre-commit run --all-files"
default-environment = "lint"
description = "Run pre-commit hooks on all files"

[tool.conda.workspace]
channel-priority = "strict"
channels = ["conda-forge"]
name = "conda"
# rich platforms declare the virtual packages needed to solve cross-platform
platforms = [
  { platform = "linux-64", glibc = "2.28" },
  { platform = "linux-aarch64", glibc = "2.28" },
  { platform = "osx-64", macos = "11.0" },
  { platform = "osx-arm64", macos = "11.0" },
  "win-64",
  "win-arm64",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "pragma: py$PYTHON_MAJOR_VERSION no cover",
  "pragma: $TEST_PLATFORM no cover",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "def __repr__",
  '\s*\.\.\.$',
  "if TYPE_CHECKING:",  # ignoring type checking imports
]
omit = [
  "*/site-packages/*",
  '*\site-packages\*',
  "conda/_private/shards/typing.py",
  "conda/_vendor.py",
  "conda/cli/activate.py",
  "conda/cli/main_package.py",
  "conda/console.py",
  "conda/exports.py",
  "conda/gateways/connection/adapters/ftp.py",
  "conda/gateways/connection/adapters/s3.py",
  "tests/*",
  "utils/*",
]
partial_branches = [
  "pragma: no branch",
]
show_missing = true
skip_covered = true
sort = "Miss"

[tool.coverage.run]
# store relative paths in coverage information
relative_files = true

[tool.hatch.build]
exclude = [
  "tests/**",
]
include = ["conda"]

[tool.hatch.build.hooks.vcs]
version-file = "conda/_version.py"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "dirty-tag"
version_scheme = "semver-pep440-release-branch"

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
# disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
# TODO(PY312): explicit-override
enable_error_code = [
  "deprecated",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = "conda/"
follow_imports_for_stubs = true
follow_untyped_imports = true
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
pretty = true
python_version = "3.11"
show_column_numbers = true
show_error_code_links = true
show_error_codes = true
strict_bytes = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = [
  "--color=auto",
  # "--cov=conda",   # passed in test runner scripts instead (avoid debugger)
  "--cov-append",
  "--cov-branch",
  "--cov-report=term",  # print summary table to screen
  "--cov-report=xml",  # for codecov/codecov-action upload
  "--durations=16",
  "--junitxml=test-report.xml",
  "--splitting-algorithm=least_duration",
  "--store-durations",  # pytest-split, update duration cache
  "--clean-durations",  # pytest-split, remove duration for tests no longer present
  "--strict-markers",
  "--tb=native",
  "-vv",
]
doctest_optionflags = [
  "NORMALIZE_WHITESPACE",
  "IGNORE_EXCEPTION_DETAIL",
  "ALLOW_UNICODE",
  "ELLIPSIS",
]
filterwarnings = [
  # elevate all deprecation warnings to errors
  "error::PendingDeprecationWarning",
  "error::DeprecationWarning",
  "error::FutureWarning",
  "ignore:Implicit installation of pip as a Python dependency:PendingDeprecationWarning",
  "ignore:Implicit installation of pip as a Python dependency:FutureWarning",
]
markers = [
  "integration: integration tests that usually require an internet connect",
  "slow: slow running tests",
  "benchmark: benchmark tests",
  "memray: memory use tests",
]
minversion = "3.0"
norecursedirs = [
  "tests/data/*",
  "tests/integration/*",
  "tests/plugins/data/*",
  "docs",
  ".git",
]
pythonpath = [
  # faking a test-plugin to test ImportError handling
  "tests/plugins/data/test-plugin",
]
testpaths = ["tests"]

[tool.ruff]
exclude = [
  "conda/auxlib",
  "tests/data/conda_format_repo",
  "tests/data/env_metadata",
]
show-fixes = true

[tool.ruff.lint]
flake8-type-checking = { exempt-modules = [], strict = true }
ignore = [
  "D101",  # Missing docstring in public class
  "D102",  # Missing docstring in public method
  "D103",  # Missing docstring in public function
  "D104",  # Missing docstring in public package
  "D105",  # Missing docstring in magic method
  "D107",  # Missing docstring in `__init__`
  "E402",  # module level import not at top of file
  "E501",  # line too long
  "E722",  # do not use bare 'except'
  "E731",  # do not assign a lambda expression, use a def
  "UP031",  # do not fix printf-style string formatting
]
pydocstyle = { convention = "google" }
# see https://docs.astral.sh/ruff/rules/
select = [
  # Enable ANN locally for type hints linting
  # "ANN", # flake8-annotations
  "B012",  # bugbear
  "D1",  # pydocstyle
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "FA",  # flake8-future-annotations
  "G",  # flake8-logging-format
  "I",  # isort
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "RUF100",  # Unused noqa directive
  "S101",  # forbid assert
  "T10",  # flake8-debugger
  "TC",  # flake8-type-checking
  "TID251",  # flake8-tidy-imports: banned-api
  "TID253",  # flake8-tidy-imports: banned-module-level-imports
  "UP",  # pyupgrade
  "W",  # pycodestyle warnings
]

[tool.ruff.lint.extend-per-file-ignores]
"conda/testing/*" = [
  "ANN",  # flake8-annotations
  "S101",  # forbid assert
]
"docs/*" = [
  "ANN",  # flake8-annotations
  "D1",  # pydocstyle
]
"tests/*" = [
  "ANN",  # flake8-annotations
  "D1",  # pydocstyle
  "S101",  # forbid assert
  "TID251",  # flake8-tidy-imports
  "TID253",  # flake8-tidy-imports: tests may import requests directly
]

[tool.ruff.lint.flake8-tidy-imports]
# Prevent accidental module-level imports of heavy packages on the startup path.
# Files that legitimately import these packages (e.g. conda/gateways/) should
# suppress the warning with # noqa: TID253 on the relevant import lines.
banned-module-level-imports = ["requests"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"json".msg = "Use `conda.common.serialize.json` instead."
