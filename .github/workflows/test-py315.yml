name: Pre-release Python Tests

on:
  # https://docs.github.com/en/webhooks-and-events/webhooks/webhook-events-and-payloads#pull_request
  pull_request:

  # https://docs.github.com/en/webhooks-and-events/webhooks/webhook-events-and-payloads#workflow_dispatch
  workflow_dispatch:

  # no payload
  schedule:
      # https://crontab.guru/#37_18_*_*_*
    - cron: 32 18 * * *

concurrency:
  # Concurrency group that uses the workflow name and PR number if available
  # or commit SHA as a fallback. If a new build is triggered under that
  # concurrency group while a previous build is running it will be canceled.
  # Repeated pushes to a PR will cancel all previous builds, while multiple
  # merges to main will not cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # focused testing or any needed pytest arguments, default empty
  PYTEST_EXTRA: ''

jobs:
  # detect whether any code changes are included in this PR
  changes:
    runs-on: ubuntu-slim
    permissions:
      # necessary to detect changes
      # https://github.com/dorny/paths-filter#supported-workflows
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # dorny/paths-filter needs git clone for non-PR events
        # https://github.com/dorny/paths-filter#supported-workflows
        if: github.event_name != 'pull_request'

      - name: Filter Changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'conda/**'
              - 'tests/**'
              - 'recipe/**'
              - '.github/workflows/benchmarks.yml'
              - '.github/workflows/tests.yml'

  # linux test suite
  linux:
    # only run test suite if there are code changes
    needs: changes
    if: >-
      (!github.event.repository.fork && github.event_name == 'schedule')
      || needs.changes.outputs.code == 'true'

    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        # https://github.com/conda-incubator/setup-miniconda#use-a-default-shell
        shell: bash -el {0}  # bash exit immediately on error + login shell
    strategy:
      fail-fast: false
      matrix:
        # test all lower versions (w/ defaults) and upper version (w/ defaults and conda-forge)
        runs-on:
          - ubuntu-latest  # linux-64
          - ubuntu-24.04-arm  # linux-aarch64
        python-version: ['3.15']
        default-channel: [defaults, conda-forge]
        test-type: [unit, integration]
        test-group: [1, 2, 3]
        
    env:
      PYTEST_MARKER: ${{ matrix.test-type == 'unit' && 'not integration and not benchmark' || 'integration and not benchmark' }}
      PYTEST_SPLITS: ${{ matrix.test-type == 'unit' && '2' || '3' }}
      CONDA_TEST_SOLVERS: ${{ matrix.python-version == '3.15' && 'classic' || 'libmamba,classic' }}
      CONDA_SOLVER: classic
      PYTEST_EXTRA: ${{ matrix.python-version == '3.15' && '--ignore=tests/test_create.py --deselect=tests/test_solvers.py::TestLibMambaSolver' || '' }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Hash + Timestamp
        run: |
          STEM="${{ runner.os }}-${{ runner.arch }}-Py${{ matrix.python-version }}-${{ matrix.default-channel }}-$(date -u "+%Y%m")"
          echo "CACHE_KEY=${STEM}" >> $GITHUB_ENV
          echo "HASH=${STEM}-${{ matrix.test-type }}-${{ matrix.test-group }}" >> $GITHUB_ENV

      - name: Cache Conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/conda_pkgs_dir/*.tar.bz2
            ~/conda_pkgs_dir/*.conda
          key: cache-${{ env.CACHE_KEY }}

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          condarc-file: .github/condarc-${{ matrix.default-channel }}-python_rc
          run-post: false  # skip post cleanup
          miniconda-version: ${{ matrix.default-channel == 'defaults' && 'latest' || null }}
          miniforge-version: ${{ matrix.default-channel == 'conda-forge' && 'latest' || null }}

      - name: Conda Install (Py3.15)
        if: matrix.python-version == '3.15'
        run: >
          conda install
          --yes
          --file tests/requirements-py315.txt
          --file tests/requirements-${{ runner.os }}-315.txt
          --file tests/requirements-ci-py315.txt
          --file tests/requirements-s3.txt
          python=${{ matrix.python-version }}

      - name: Conda Install
        if: matrix.python-version != '3.15'
        run: >
          conda install
          --yes
          --file tests/requirements.txt
          --file tests/requirements-${{ runner.os }}.txt
          --file tests/requirements-ci.txt
          --file tests/requirements-s3.txt
          python=${{ matrix.python-version }}

      - name: Install conda (in dev mode) and special deps
        if: matrix.python-version == '3.15'
        run: |
          python -m pip install pycosat
          python -m pip install -e .  --no-deps
          # Ensure conda executable is available
          python -m conda --version

      - name: Conda Info
        # view test env info (not base)
        run: python -m conda info --verbose

      - name: Conda Config
        run: conda config --show-sources

      - name: Conda List
        run: conda list --show-channel-urls

      - name: Setup Shells
        # for tests/shell, so only necessary for integration tests
        if: matrix.test-type == 'integration'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The default Azure-hosted Ubuntu apt mirror has been hanging
          # for hours on the integration jobs. Switch to the canonical
          # archive and let apt retry on transient failures so a single
          # mirror outage does not block CI.
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 ash csh fish tcsh zsh
          # xonsh is installed with conda in step above
          # Initialize all shells
          python -m conda init --all

      - name: Run Tests
        run: >
          python -m pytest
          --cov=conda
          --durations-path=durations/${{ runner.os }}.json
          --group=${{ matrix.test-group }}
          --splits=${{ env.PYTEST_SPLITS }}
          -m "${{ env.PYTEST_MARKER }}"
          ${{ env.PYTEST_EXTRA }}

      - name: Upload Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          flags: ${{ runner.os }},${{ runner.arch }},${{ matrix.python-version }},${{ matrix.test-type }}
          token: ${{ secrets.CODECOV_TOKEN }}  # required

      - name: Upload Test Results
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ env.HASH }}
          include-hidden-files: true
          path: |
            .coverage
            durations/${{ runner.os }}.json
            test-report.xml
          retention-days: 1  # temporary, combined in aggregate below
