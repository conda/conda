name: Pre-release Python Tests

on:
  pull_request:

  # https://docs.github.com/en/webhooks-and-events/webhooks/webhook-events-and-payloads#workflow_dispatch
  workflow_dispatch:

  # no payload
  schedule:
      # https://crontab.guru/#37_18_*_*_*
    - cron: 37 20 * * *

concurrency:
  # Concurrency group that uses the workflow name and PR number if available
  # or commit SHA as a fallback. If a new build is triggered under that
  # concurrency group while a previous build is running it will be canceled.
  # Repeated pushes to a PR will cancel all previous builds, while multiple
  # merges to main will not cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # https://conda.github.io/conda-libmamba-solver/user-guide/configuration/#advanced-options
  CONDA_LIBMAMBA_SOLVER_NO_CHANNELS_FROM_INSTALLED: true
  # focused testing or any needed pytest arguments, default empty
  PYTEST_EXTRA: ''

jobs:


  # windows test suite
  windows:
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        # test lower version (w/ defaults) and upper version (w/ defaults and conda-forge)
        runs-on: [windows-latest, windows-11-arm]
        python-version: ['3.15']
        default-channel: [defaults, conda-forge]
        test-type: [unit, integration]
        test-group: [1, 2, 3]
        include:
          - subdir: win-64
          - runs-on: windows-11-arm
            default-channel: conda-forge
            subdir: win-arm64
    env:
      ErrorActionPreference: Stop  # powershell exit immediately on error
      PYTEST_MARKER: ${{ matrix.test-type == 'unit' && 'not integration and not benchmark' || 'integration and not benchmark' }}
      PYTEST_SPLITS: ${{ matrix.test-type == 'unit' && '2' || '3' }}
      CONDA_TEST_SOLVERS: classic
      CONDA_TEST_SUBDIR: ${{ matrix.subdir }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Hash + Timestamp
        shell: bash  # use bash to run date command
        run: |
          STEM="${{ runner.os }}-${{ runner.arch }}-${{ matrix.subdir }}-Py${{ matrix.python-version }}-${{ matrix.default-channel }}-$(date -u "+%Y%m")"
          echo "CACHE_KEY=${STEM}" >> $GITHUB_ENV
          echo "HASH=${STEM}-${{ matrix.test-type }}-${{ matrix.test-group }}" >> $GITHUB_ENV

      - name: Cache Conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Use faster GNU tar for all runners
          enableCrossOsArchive: true
          path: |
            ~/conda_pkgs_dir/*.tar.bz2
            ~/conda_pkgs_dir/*.conda
          key: cache-${{ env.CACHE_KEY }}

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          condarc-file: .github\condarc-${{ matrix.default-channel }}
          run-post: false  # skip post cleanup
          # Use x64 Miniconda to bootstrap the test environment until a native installer is available.
          architecture: x64
        env:
          CONDA_SUBDIR: win-64

      # # Workaround: miniforge ships c-l-s 26.4.0 which has a sqlite locking bug.
      # # Remove once miniforge ships c-l-s >=26.4.1.
      # - name: Upgrade conda-libmamba-solver
      #   run: conda install -n base --yes "conda-libmamba-solver>=26.4.1"
      #   env:
      #     CONDA_SUBDIR: win-64

      - name: Conda Install
        run: >
          conda install
          --yes
          --file tests\requirements-py315.txt
          --file tests\requirements-${{ runner.os }}.txt
          --file tests\requirements-ci-py315.txt
          --file tests\requirements-s3.txt
          python=${{ matrix.python-version }}
        env:
          CONDA_SUBDIR: ${{ matrix.subdir }}

      - name: Install conda in dev mode
        run: |
          python -m pip install -e .  --no-deps
          # Ensure conda executable is available
          python -m conda --version

      - name: Conda Info
        # view test env info (not base)
        run: python -m conda info --verbose

      - name: Conda Config
        run: conda config --show-sources

      - name: Conda List
        run: conda list --show-channel-urls

      - name: Setup PowerShell
        # for tests/shell, so only necessary for integration tests
        if: matrix.test-type == 'integration'
        run: |
          $PWSH_STABLE = "$env:LOCALAPPDATA\Microsoft\powershell"
          Invoke-Expression "& { $(Invoke-RestMethod https://aka.ms/install-powershell.ps1) } -Destination `"$PWSH_STABLE`""
          $PWSH_PREVIEW = "$env:LOCALAPPDATA\Microsoft\powershell-preview"
          Invoke-Expression "& { $(Invoke-RestMethod https://aka.ms/install-powershell.ps1) } -Preview -Destination `"$PWSH_PREVIEW`""
          "PWSHPATH=$PWSH_STABLE;$PWSH_PREVIEW" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: PowerShell Info
        # for tests/shell, so only necessary for integration tests
        if: matrix.test-type == 'integration'
        run: |
          Get-Command -All powershell
          "$env:PWSHPATH" -split ";" | ForEach-Object { Get-Command -All "$_\pwsh" }

      - name: Run Tests
        # Windows is sensitive to long paths, using `--basetemp=${{ runner.temp }} to
        # keep the test directories shorter
        run: |
          $env:CONDA_EXE = "$env:CONDA_PREFIX\Scripts\conda.exe"
          python -m pytest `
          --cov=conda `
          --basetemp=${{ runner.temp }} `
          --durations-path=durations\${{ runner.os }}.json `
          --group=${{ matrix.test-group }} `
          --splits=${{ env.PYTEST_SPLITS }} `
          -m "${{ env.PYTEST_MARKER }}" `
          ${{ env.PYTEST_EXTRA }}

      - name: Upload Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          flags: ${{ runner.os }},${{ runner.arch }},${{ matrix.subdir }},${{ matrix.python-version }},${{ matrix.test-type }}
          token: ${{ secrets.CODECOV_TOKEN }}  # required

      - name: Upload Test Results
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ env.HASH }}
          include-hidden-files: true
          path: |
            .coverage
            durations\${{ runner.os }}.json
            test-report.xml
          retention-days: 1  # temporary, combined in aggregate below

  # linux test suite
  linux:
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        # https://github.com/conda-incubator/setup-miniconda#use-a-default-shell
        shell: bash -el {0}  # bash exit immediately on error + login shell
    strategy:
      fail-fast: false
      matrix:
        # test all lower versions (w/ defaults) and upper version (w/ defaults and conda-forge)
        runs-on:
          - ubuntu-latest  # linux-64
          - ubuntu-24.04-arm  # linux-aarch64
        python-version: ['3.15']
        default-channel: [defaults, conda-forge]
        test-type: [unit, integration]
        test-group: [1, 2, 3]
    env:
      PYTEST_MARKER: ${{ matrix.test-type == 'unit' && 'not integration and not benchmark' || 'integration and not benchmark' }}
      PYTEST_SPLITS: ${{ matrix.test-type == 'unit' && '2' || '3' }}
      CONDA_TEST_SOLVERS: classic

    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Hash + Timestamp
        run: |
          STEM="${{ runner.os }}-${{ runner.arch }}-Py${{ matrix.python-version }}-${{ matrix.default-channel }}-$(date -u "+%Y%m")"
          echo "CACHE_KEY=${STEM}" >> $GITHUB_ENV
          echo "HASH=${STEM}-${{ matrix.test-type }}-${{ matrix.test-group }}" >> $GITHUB_ENV

      - name: Cache Conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/conda_pkgs_dir/*.tar.bz2
            ~/conda_pkgs_dir/*.conda
          key: cache-${{ env.CACHE_KEY }}

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          condarc-file: .github/condarc-${{ matrix.default-channel }}
          run-post: false  # skip post cleanup
          miniconda-version: ${{ matrix.default-channel == 'defaults' && 'latest' || null }}
          miniforge-version: ${{ matrix.default-channel == 'conda-forge' && 'latest' || null }}

      # Workaround: miniforge ships c-l-s 26.4.0 which has a sqlite locking bug.
      # Remove once miniforge ships c-l-s >=26.4.1.
      # - name: Upgrade conda-libmamba-solver
      #   run: conda install -n base --yes "conda-libmamba-solver>=26.4.1"

      - name: Conda Install
        run: >
          conda install
          --yes
          --file tests/requirements-py315.txt
          --file tests/requirements-${{ runner.os }}-315.txt
          --file tests/requirements-ci-py315.txt
          --file tests/requirements-s3.txt
          python=${{ matrix.python-version }}

      - name: Install conda in dev mode
        if: matrix.python-version == '3.15'
        run: |
          python -m pip install -e .  --no-deps
          # Ensure conda executable is available
          python -m conda --version

      - name: Conda Info
        # view test env info (not base)
        run: python -m conda info --verbose

      - name: Conda Config
        run: conda config --show-sources

      - name: Conda List
        run: conda list --show-channel-urls

      - name: Setup Shells
        # for tests/shell, so only necessary for integration tests
        if: matrix.test-type == 'integration'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The default Azure-hosted Ubuntu apt mirror has been hanging
          # for hours on the integration jobs. Switch to the canonical
          # archive and let apt retry on transient failures so a single
          # mirror outage does not block CI.
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 ash csh fish tcsh zsh
          # xonsh is installed with conda in step above
          # Initialize all shells
          python -m conda init --all

      - name: Run Tests
        run: >
          python -m pytest
          --cov=conda
          --durations-path=durations/${{ runner.os }}.json
          --group=${{ matrix.test-group }}
          --splits=${{ env.PYTEST_SPLITS }}
          -m "${{ env.PYTEST_MARKER }}"
          ${{ env.PYTEST_EXTRA }}

      - name: Upload Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          flags: ${{ runner.os }},${{ runner.arch }},${{ matrix.python-version }},${{ matrix.test-type }}
          token: ${{ secrets.CODECOV_TOKEN }}  # required

      - name: Upload Test Results
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ env.HASH }}
          include-hidden-files: true
          path: |
            .coverage
            durations/${{ runner.os }}.json
            test-report.xml
          retention-days: 1  # temporary, combined in aggregate below

  # macos test suite
  macos:
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        # https://github.com/conda-incubator/setup-miniconda#use-a-default-shell
        shell: bash -el {0}  # bash exit immediately on error + login shell
    strategy:
      fail-fast: false
      matrix:
        # test lower version (w/ osx-64 & defaults & unit tests) and upper version (w/ osx-arm64 & defaults & integration tests)
        runs-on:
          - macos-15-intel  # osx-64
          - macos-latest  # osx-arm64
        python-version: ['3.15']
        default-channel: [defaults, conda-forge]
        test-type: [unit, integration]
        test-group: [1, 2, 3]
    env:
      PYTEST_MARKER: ${{ matrix.test-type == 'unit' && 'not integration and not benchmark' || 'integration and not benchmark' }}
      PYTEST_SPLITS: ${{ matrix.test-type == 'unit' && '2' || '3' }}
      CONDA_TEST_SOLVERS: classic

    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Hash + Timestamp
        run: |
          STEM="${{ runner.os }}-${{ runner.arch }}-Py${{ matrix.python-version }}-${{ matrix.default-channel }}-$(date -u "+%Y%m")"
          echo "CACHE_KEY=${STEM}" >> $GITHUB_ENV
          echo "HASH=${STEM}-${{ matrix.test-type }}-${{ matrix.test-group }}" >> $GITHUB_ENV

      - name: Cache Conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/conda_pkgs_dir/*.tar.bz2
            ~/conda_pkgs_dir/*.conda
          key: cache-${{ env.CACHE_KEY }}

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          condarc-file: .github/condarc-${{ matrix.default-channel }}
          run-post: false  # skip post cleanup
          miniconda-version: ${{ matrix.default-channel == 'defaults' && 'latest' || null }}
          miniforge-version: ${{ matrix.default-channel == 'conda-forge' && 'latest' || null }}

      # Workaround: miniforge ships c-l-s 26.4.0 which has a sqlite locking bug.
      # Remove once miniforge ships c-l-s >=26.4.1.
      - name: Upgrade conda-libmamba-solver
        run: conda install -n base --yes "conda-libmamba-solver>=26.4.1"

      - name: Conda Install
        run: >
          conda install
          --yes
          --file tests/requirements-py315.txt
          --file tests/requirements-ci-py315.txt
          --file tests/requirements-s3.txt
          python=${{ matrix.python-version }}
       
      - name: Install conda in dev mode
        if: matrix.python-version == '3.15'
        run: |
          python -m pip install -e .  --no-deps
          # Ensure conda executable is available
          python -m conda --version

      - name: Conda Info
        # view test env info (not base)
        run: python -m conda info --verbose

      - name: Conda Config
        run: conda config --show-sources

      - name: Conda List
        run: conda list --show-channel-urls

      - name: Setup Shells
        # for tests/shell, so only necessary for integration tests
        if: matrix.test-type == 'integration'
        run: brew update && brew install fish xonsh

      - name: Run Tests
        run: >
          python -m pytest
          --cov=conda
          --durations-path=durations/${{ runner.os }}.json
          --group=${{ matrix.test-group }}
          --splits=${{ env.PYTEST_SPLITS }}
          -m "${{ env.PYTEST_MARKER }}"
          ${{ env.PYTEST_EXTRA }}

      - name: Upload Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          flags: ${{ runner.os }},${{ runner.arch }},${{ matrix.python-version }},${{ matrix.test-type }}
          token: ${{ secrets.CODECOV_TOKEN }}  # required

      - name: Upload Test Results
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ env.HASH }}
          include-hidden-files: true
          path: |
            .coverage
            durations/${{ runner.os }}.json
            test-report.xml
          retention-days: 1  # temporary, combined in aggregate below

  # aggregate and upload
  aggregate:
    # only aggregate test suite if there are code changes
    needs: [changes, windows, linux, linux-benchmarks, linux-qemu, macos]
    if: >-
      !cancelled()
      && (
        (!github.event.repository.fork && github.event_name == 'schedule')
        || needs.changes.outputs.code == 'true'
      )

    runs-on: ubuntu-slim
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Upload Combined Test Results
        # provides one downloadable archive of all matrix run test results for further analysis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.sha }}-all
          include-hidden-files: true
          path: test-results-*
          retention-days: 7  # for durations.yml workflow

      - name: Test Summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: test-results-*/test-report.xml

  # required check
  analyze:
    needs: [windows, linux, linux-qemu, linux-benchmarks, macos, aggregate]
    if: '!cancelled()'

    runs-on: ubuntu-slim
    steps:
      - name: Determine Success
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        id: alls-green
        with:
          # permit jobs to be skipped if there are no code changes (see changes job)
          allowed-skips: ${{ toJSON(needs) }}
          jobs: ${{ toJSON(needs) }}

      - name: Report failures
        if: >-
          always()
          && github.event_name == 'schedule'
          && steps.alls-green.outputs.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.AUTO_REPORT_TEST_FAILURE }}
        run: |
          DAY=$(date -u '+%Y-%m-%d')
          TITLE="${{ github.workflow }} failed (${DAY})"
          BODY="The ${{ github.workflow }} workflow failed at $(date -u '+%Y-%m-%d %H:%M') UTC

          Full run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "\"${TITLE}\" in:title label:source::auto sort:created-desc" \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body "$BODY"
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --body "$BODY" \
              --label "¡blocking!,type::bug,type::testing,source::auto"
          fi
