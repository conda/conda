name: Update Repository

on:
  # every Sunday at 00:36 UTC
  # https://crontab.guru/#36_2_*_*_0
  schedule:
    - cron: 36 2 * * 0

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    name: Update repository files
    runs-on: ubuntu-slim
    permissions:
      contents: write  # Required to commit synced template and workflow updates.
      pull-requests: write  # Required to open the generated update pull request.
      issues: write  # Required for generated update pull request metadata.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure git user
        run: |
          git config --global user.name 'Conda Bot'
          git config --global user.email '18747875+conda-bot@users.noreply.github.com'

      - uses: conda/actions/combine-durations@ade1a3a5e5b7d3d124a03bf5d8c841645fb92a37 # v26.9.4
        id: durations
        continue-on-error: true

      - uses: conda/actions/template-files@ade1a3a5e5b7d3d124a03bf5d8c841645fb92a37 # v26.9.4
        id: templates
        continue-on-error: true

      - name: Commit changes
        # no-op if there are no updates
        continue-on-error: true
        run: |
          git add .
          git commit --message "🤖 updated file(s)"

      - name: Create fork
        # no-op if the repository is already forked
        run: |
          FORK="$(gh api repos/:owner/:repo/forks --method POST -f default_branch_only=true --jq .full_name)"
          echo "FORK=${FORK}" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}

      - name: Compose pull request body
        # written to disk (instead of `body:`) to avoid E2BIG ("Argument list
        # too long") when large summaries are passed as action inputs
        run: |
          cat >> "$RUNNER_TEMP/pr-body.md" <<EOF
          [update.yml]: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/.github/workflows/update.yml

          Your friendly repository updater.

          $DURATIONS_SUMMARY

          $TEMPLATES_SUMMARY

          This PR was triggered by @$GITHUB_TRIGGERING_ACTOR via $GITHUB_EVENT_NAME.

          ###### Auto-generated by the [\`update.yml\`][update.yml] workflow, see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.
          EOF
        env:
          DURATIONS_SUMMARY: ${{ steps.durations.outputs.summary }}
          TEMPLATES_SUMMARY: ${{ steps.templates.outputs.summary }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          push-to-fork: ${{ env.FORK }}
          token: ${{ secrets.SYNC_TOKEN }}
          branch: update
          delete-branch: true
          title: 🤖 Update infrastructure file(s)
          body-path: ${{ runner.temp }}/pr-body.md
