# edit this in https://github.com/conda/infrastructure

name: Prepare authors

on:
  # https://crontab.guru/#0_3_*_*_1
  schedule:
    - cron: '0 3 * * 1'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    if: '!github.event.repository.fork'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Prepare Authors
        uses: conda/actions/prepare-authors@ade1a3a5e5b7d3d124a03bf5d8c841645fb92a37 # v26.9.4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          since: tag
          base-branch: main
