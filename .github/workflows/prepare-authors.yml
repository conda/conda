# edit this in https://github.com/conda/infrastructure

name: Prepare authors

on:
  # https://crontab.guru/#0_3_*_*_1
  schedule:
    - cron: '0 3 * * 1'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    if: '!github.event.repository.fork'
    runs-on: ubuntu-slim
    steps:
      - name: Prepare Authors
        uses: conda/actions/prepare-authors@08d912c833fae64489ad7a438b3c7b68e177a643 # v26.11.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          since: tag
          base-branch: main
