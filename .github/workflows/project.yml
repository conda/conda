name: Add to Project

on:
  pull_request_target:  # zizmor: ignore[dangerous-triggers] Adds PRs to a project board only; no untrusted code is checked out.
    types:
      - opened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  add_to_project:
    name: Add pull request to project
    if: '!github.event.repository.fork'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          # PRs are added to the Review project
          project-url: https://github.com/orgs/conda/projects/16
          github-token: ${{ secrets.PROJECT_TOKEN }}  # zizmor: ignore[secrets-outside-env] Project board token; environment policy unchanged.
