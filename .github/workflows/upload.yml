# edit this in https://github.com/conda/infrastructure

name: Upload release

on:
  # https://docs.github.com/en/webhooks/webhook-events-and-payloads#release
  release:
    types: [published]

concurrency:
  # Concurrency group that uses the workflow name and PR number if available
  # or commit SHA as a fallback. If a new build is triggered under that
  # concurrency group while a previous build is running it will be canceled.
  # Repeated pushes to a PR will cancel all previous builds, while multiple
  # merges to main will not cancel.
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  # create source archive and upload it to the published release
  # URL to the archive: https://github.com/conda/<repo>/releases/download/<tag>/<repo>-<tag>.tar.gz
  upload:
    name: Upload source archive
    if: '!github.event.repository.fork'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to upload source archives and checksums to releases.
    env:
      ARCHIVE_NAME: ${{ github.event.repository.name }}-${{ github.event.release.tag_name }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Release Directory
        run: mkdir -p release

      - name: Archive Source
        run: >
          git archive
          --prefix="$ARCHIVE_NAME/"
          --output="release/$ARCHIVE_NAME.tar.gz"
          HEAD

      - name: Compute Checksum
        run: >
          sha256sum "release/$ARCHIVE_NAME.tar.gz"
          | awk '{print $1}'
          > "release/$ARCHIVE_NAME.tar.gz.sha256sum"

      - name: Upload Archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >
          gh release upload
          --clobber "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          release/*
