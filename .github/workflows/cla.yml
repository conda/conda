name: CLA

on:
  issue_comment:
    types:
      - created
  pull_request_target:

concurrency:
  # Only share a concurrency group with runs that can actually perform the check
  # (a `pull_request_target` event, or an `issue_comment` that is a `@conda-bot check`
  # request). Every other `issue_comment` (bot noise, unrelated comments, etc.) is
  # skipped by the job's `if:` below anyway, but without this it would still join the
  # same group and cancel an in-progress, legitimate CLA check.
  group: >-
    ${{ github.workflow }}-${{
      (github.event_name == 'pull_request_target' || github.event.comment.body == '@conda-bot check')
      && (github.event.pull_request.number || github.event.issue.number)
      || github.run_id
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check CLA
    if: >-
      !github.event.repository.fork
      && (
        github.event.issue.pull_request
        && github.event.comment.body == '@conda-bot check'
        || github.event_name == 'pull_request_target'
      )
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write  # Required to update labels and comments on pull requests.
      statuses: write  # Required to publish the CLA commit status.
    steps:
      - name: Check CLA
        uses: conda/actions/check-cla@210fa69f0b174ee4ea463a3a5402ec5a1d95d6db # v26.9.0
        with:
          # [required]
          # A token with ability to comment, label, and modify the commit status
          # (`pull_request: write` and `statuses: write` for fine-grained PAT; `repo` for classic PAT)
          # (default: secrets.GITHUB_TOKEN)
          token: ${{ secrets.CLA_ACTION_TOKEN }}
          # [required]
          # Label to apply to contributor's PR once CLA is signed
          label: cla-signed

          # [required]
          # Token for opening signee PR in the provided `cla_repo`
          # (`pull_request: write` for fine-grained PAT; `repo` and `workflow` for classic PAT)
          cla_token: ${{ secrets.CLA_FORK_TOKEN }}
