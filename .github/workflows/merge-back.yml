# edit this in https://github.com/conda/infrastructure

name: Merge back into main

on:
  # https://docs.github.com/en/webhooks/webhook-events-and-payloads#release
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merge-back:
    if: '!github.event.repository.fork'
    runs-on: ubuntu-slim
    permissions:
      contents: write  # Required to push the connector branch.
      pull-requests: write  # Required to open the merge-back pull request.
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Derive branches
        id: branches
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected tag $TAG, expected YY.MM.MICRO."
            exit 1
          fi
          {
            echo "release=${TAG%.*}.x"
            echo "connector=connector-${TAG%.*}.x"
          } >> "$GITHUB_OUTPUT"

      - name: Push connector branch
        # reset (rather than fast-forward) in case the connector branch still
        # exists from an earlier patch release on the same release branch
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          RELEASE_BRANCH: ${{ steps.branches.outputs.release }}
          CONNECTOR_BRANCH: ${{ steps.branches.outputs.connector }}
        run: |
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_BRANCH" --jq .object.sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST \
            --raw-field "ref=refs/heads/$CONNECTOR_BRANCH" \
            --raw-field "sha=$SHA" \
          || gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/$CONNECTOR_BRANCH" --method PATCH \
            --raw-field "sha=$SHA" \
            --field force=true

      - name: Compose pull request body
        env:
          RELEASE_BRANCH: ${{ steps.branches.outputs.release }}
          CONNECTOR_BRANCH: ${{ steps.branches.outputs.connector }}
        run: |
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Merges the \`$RELEASE_BRANCH\` release branch back into \`main\` following the [\`$TAG\` release]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG).

          The \`$CONNECTOR_BRANCH\` branch is a copy of \`$RELEASE_BRANCH\` so that merge conflicts can be resolved by pushing to this branch instead of the release branch itself.

          > [!IMPORTANT]
          > To resolve merge conflicts, merge \`main\` into \`$CONNECTOR_BRANCH\` and push the merge commit here. Do **not** push \`main\` onto \`$RELEASE_BRANCH\`.

          > [!IMPORTANT]
          > Merge this PR with a **merge commit** (not a squash merge) so the individual release commits are retained on \`main\`.

          See the [release process]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/releases/RELEASE.md) for details.

          ###### Auto-generated by the [\`merge-back.yml\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/.github/workflows/merge-back.yml) workflow, see $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.
          EOF

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          RELEASE_BRANCH: ${{ steps.branches.outputs.release }}
          CONNECTOR_BRANCH: ${{ steps.branches.outputs.connector }}
        run: |
          EXISTING="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$CONNECTOR_BRANCH" --json url --jq '.[0].url // empty')"
          if [[ "$EXISTING" ]]; then
            echo "::notice::Pull request already open: $EXISTING"
            exit 0
          fi
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$CONNECTOR_BRANCH" \
            --title "🤖 Merge $RELEASE_BRANCH back into main" \
            --body-file "$RUNNER_TEMP/pr-body.md"
