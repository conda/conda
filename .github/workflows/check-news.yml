# edit this in https://github.com/conda/infrastructure

name: Check news

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  check-news:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check News
        uses: conda/actions/check-news@210fa69f0b174ee4ea463a3a5402ec5a1d95d6db # v26.9.0
        with:
          skip-label: no-news
          require-pr-number: true
          news-directory: news
