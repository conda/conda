package:
  name: dependent
  version: '{{ pkg_version }}'

build:
  noarch: generic
  string: "0"

requirements:
  run:
    - '{{ pin_subpackage("dependency") }}'

outputs:
  - name: dependency
    build:
      noarch: generic
      string: "0"

about:
  summary: Depends on co-built dependency output; generic pin/remove fixture
